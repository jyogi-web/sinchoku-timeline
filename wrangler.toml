name = "sinchoku-timeline"
# デプロイ先の Cloudflare アカウント（シークレットではない）
account_id = "da1ba209d61b3c9fb6834468fb0bb4f4"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# 5分ごとにポーリングを実行する（docs/spec.md §4）
# 1日1回（UTC 0:10）/ranking 用の草と PR 数を取る（§6.1。src/index.ts の DAILY_CRON と同じにする）
[triggers]
crons = ["*/5 * * * *", "10 0 * * *"]

# `npx wrangler d1 create sinchoku-timeline` で作成したデータベース
[[d1_databases]]
binding = "DB"
database_name = "sinchoku-timeline"
database_id = "1a212b79-8232-4b07-90cb-767561776a67"
migrations_dir = "migrations"

# シークレットはここに書かない。本番は `npx wrangler secret put <名前>`、ローカルは .dev.vars に書く
#   GITHUB_TOKEN            運営側の Personal Access Token（スコープなし）
#   DISCORD_APPLICATION_ID  Discord アプリケーションの ID
#   DISCORD_PUBLIC_KEY      Discord アプリケーションの公開鍵（Interactions の署名検証に使う）
#   DISCORD_BOT_TOKEN       Bot トークン（投稿と権限確認に使う）
